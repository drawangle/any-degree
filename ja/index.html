<h1 id="title"></h1>
<p id="desc"></p>

<script>
async function loadLang() {
  const path = window.location.pathname.split("/")[1]; // repo名
  const res = await fetch(`/${path}/lang/ja.json`);
  const dict = await res.json();
  document.getElementById("title").textContent = dict.title;
  document.getElementById("desc").textContent = dict.description;
}
loadLang();
</script>
