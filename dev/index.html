<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <script>
    const path = window.location.pathname.split("/")[1]; // repo名
    const lang = (navigator.language || "en").slice(0, 2);
    const supported = ["en", "ja", "zh"];
    const target = supported.includes(lang) ? lang : "en";
    location.href = `/${path}/${target}/index.html`;
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
